version: "3.9"

services:
  maya-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maya-ai-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID_MAYA=${ELEVENLABS_VOICE_ID_MAYA}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_BASIC=${STRIPE_PRICE_BASIC}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM}
      - STRIPE_PRICE_VIP=${STRIPE_PRICE_VIP}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - CRON_SECRET=${CRON_SECRET}
      - MODERATION_ENABLED=${MODERATION_ENABLED:-true}
      - NSFW_FILTER_ENABLED=${NSFW_FILTER_ENABLED:-true}
    depends_on:
      - postgres
      - redis
    networks:
      - maya-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: maya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maya_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - maya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maya-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - maya-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  cron:
    image: node:20-alpine
    container_name: maya-cron
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
    environment:
      - APP_URL=http://maya-app:3001
      - CRON_SECRET=${CRON_SECRET}
    command: sh -c "
      apk add --no-cache curl &&
      while true; do
        HOUR=$(date +%H);
        MINUTE=$(date +%M);
        if [ \"$HOUR\" = \"09\" ] && [ \"$MINUTE\" = \"00\" ]; then
          curl -X POST http://maya-app:3001/api/cron/morning-message -H \"Authorization: Bearer $CRON_SECRET\";
        fi;
        if [ \"$MINUTE\" = \"00\" ]; then
          curl -X POST http://maya-app:3001/api/cron/content-schedule -H \"Authorization: Bearer $CRON_SECRET\";
        fi;
        sleep 60;
      done
    "
    depends_on:
      - maya-app
    networks:
      - maya-network

volumes:
  postgres_data:
  redis_data:

networks:
  maya-network:
    driver: bridge
